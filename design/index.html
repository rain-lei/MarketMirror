<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MarketMirror — 仿真实验平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#analysis" aria-label="MarketMirror 首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>MarketMirror<small>RESEARCH STUDIO</small></span></a>
      <div class="workspace"><span class="workspace-icon">M</span><span>个人研究空间<small>本地工作区</small></span><span class="workspace-lock" data-icon="lock"></span></div>
      <div class="nav-caption">工作空间</div>
      <nav>
        <a href="#experiments" data-nav="experiments"><span data-icon="grid"></span><span class="nav-label">实验空间</span><span class="nav-count">3</span></a>
        <a href="#analysis" data-nav="analysis" class="active"><span data-icon="chart"></span><span class="nav-label">结果分析</span></a>
        <a href="#sources" data-nav="sources"><span data-icon="document"></span><span class="nav-label">消息资料</span></a>
        <a href="#agents" data-nav="agents"><span data-icon="agents"></span><span class="nav-label">策略配置</span></a>
      </nav>
      <div class="sidebar-note"><span class="note-symbol" data-icon="layers"></span><p>从信息到决策<br>让每一步都有迹可循</p><span>MECHANISM · EVIDENCE · REPLAY</span></div>
      <div class="sidebar-bottom"><button type="button" data-action="help"><span data-icon="help"></span><span class="nav-label">使用说明</span></button><button type="button" data-action="settings"><span data-icon="settings"></span><span class="nav-label">模型设置</span></button><div class="profile"><span class="avatar">R</span><span>Researcher<small>个人工作区</small></span><button class="icon-button" type="button" data-action="theme" aria-label="切换深浅主题"><span data-icon="moon"></span></button></div></div>

    <div class="main-shell">

      <footer class="page-footer"><span><i class="tiny-dot"></i> MarketMirror Research Studio</span><span>本机研究空间 · 合成市场实验</span></footer>
    </div>

  <dialog id="detail-dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="analysis-state.js"></script>
  <script src="strategy-state.js"></script>
  <script src="decision-view.js"></script>
  <script src="app.js"></script>
